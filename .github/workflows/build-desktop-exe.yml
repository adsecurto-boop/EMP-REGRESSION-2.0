name: Build & Release Desktop EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        shell: powershell
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          npm install --force
          npm install --no-save @tailwindcss/oxide-win32-x64-msvc @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @esbuild/win32-x64
          pip install playwright requests

      - name: Install Playwright Browsers (Chrome)
        run: npx playwright install chromium

      - name: Build Web App & Backend Server
        run: npm run build

      - name: Extract Version from package.json
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "Version extracted: v$VERSION"

      - name: Build and Package Windows Desktop Executables (Installer & Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --config electron-builder.json --publish always || npx electron-builder --config electron-builder.json --publish never

      - name: Publish Public GitHub Release for Auto-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: EmpMonitor Desktop Suite ${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-electron/*.exe
            dist-electron/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmpMonitor-Desktop-EXE-${{ env.APP_VERSION }}
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
